name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }} (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build tools for the installed-wheel tests
        run: |
          python -m pip install "setuptools>=77"
          # tests/test_install.py skips itself without them (setup-python's 3.12+ have no setuptools); here it must run
          python -c 'import sys; sys.path[:0] = ["tests"]; import test_install; sys.exit(test_install.CANNOT_BUILD or None)'

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Generated shell files parse
        shell: bash
        run: |
          # Without an rc-file option `keyfit setup` writes only into KEYFIT_CONFIG_DIR;
          # HOME is a throwaway too, so nothing outside the temp dirs is touched.
          # Checks every shell.* file it generates (shell.zsh today, more shells later).
          config="$(mktemp -d)"
          HOME="$(mktemp -d)" KEYFIT_CONFIG_DIR="$config" python -m keyfit setup
          checked=0
          for file in "$config"/shell.*; do
            [ -e "$file" ] || continue
            case "$file" in
              *.zsh) checker=zsh ;;
              *.sh | *.bash) checker=/bin/bash ;;  # the bash macOS ships (3.2): the oldest our users run
              *) echo "::error::no syntax checker for $(basename "$file")"; exit 1 ;;
            esac
            echo "$checker -n $(basename "$file")"
            "$checker" -n "$file"
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::keyfit setup wrote no shell.* file"
            exit 1
          fi
