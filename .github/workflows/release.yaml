name: Release

# Publishes to PyPI when a version tag is pushed (git push origin vX.Y.Z), with PyPI trusted
# publishing: GitHub proves to PyPI which workflow is running, so no PyPI token exists anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Actions are pinned to commit hashes (a tag can be moved; a hash cannot). Update them together
# with their version comments.
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Build tools for the installed-wheel tests
        run: |
          python -m pip install "setuptools>=77"
          # tests/test_install.py skips itself without them (setup-python's 3.12+ have no setuptools); here it must run
          python -c 'import sys; sys.path[:0] = ["tests"]; import test_install; sys.exit(test_install.CANNOT_BUILD or None)'
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Tag matches the version
        run: |
          version="$(python -c 'import keyfit; print(keyfit.__version__)')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but keyfit says $version"; exit 1; }
      - name: Build
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check dist/*
      - name: The wheel installs and runs
        run: |
          # in a fresh virtualenv, from a folder outside the checkout, with a throwaway HOME and config folder
          venv="$(mktemp -d)/venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --no-index "$PWD"/dist/*.whl  # --no-index: it needs nothing else
          cd "$(mktemp -d)"
          [ "$("$venv/bin/keyfit" --version)" = "keyfit ${GITHUB_REF_NAME#v}" ] || { echo "::error::the wheel is not ${GITHUB_REF_NAME#v}"; exit 1; }
          HOME="$(mktemp -d)" KEYFIT_CONFIG_DIR="$(mktemp -d)" "$venv/bin/keyfit" setup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/keyfit/
    permissions:
      id-token: write  # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
